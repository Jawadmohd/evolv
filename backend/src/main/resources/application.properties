spring.application.name=evolv-backend
server.port=${PORT:8080}
server.servlet.context-path=/api/v1

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/evolv}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

springdoc.api-docs.path=/docs/api
springdoc.swagger-ui.path=/docs/swagger

evolv.security.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me-change-me}
evolv.security.jwt.access-token-ttl=PT15M
evolv.security.jwt.refresh-token-ttl=P14D

# Comma-separated Google OAuth client IDs (web, iOS, Android) allowed as ID token audiences
evolv.security.google.client-ids=${GOOGLE_CLIENT_IDS:}

evolv.youtube.api-key=${YOUTUBE_API_KEY:}
evolv.ollama.url=${OLLAMA_URL:http://localhost:11434}
evolv.ollama.model=${OLLAMA_MODEL:llama3.2}
